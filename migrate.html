<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDapp · Migrar datos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:system-ui,sans-serif;background:#0a0b0e;color:#eef0f5;margin:0;padding:24px;max-width:560px;margin-inline:auto;}
  h1{font-size:18px;}
  input{display:block;width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#181b22;color:#fff;font-size:16px;box-sizing:border-box;}
  button{width:100%;padding:14px;border-radius:8px;border:none;background:#a8e063;color:#0a0b0e;font-weight:700;font-size:16px;}
  #out{margin-top:20px;white-space:pre-wrap;font-size:14px;line-height:1.6;}
  .ok{color:#a8e063;} .err{color:#ff4d4d;} .warn{color:#f9c846;}
</style>
</head>
<body>
<h1>PDapp · Migrar jugadores de JSONBin → Supabase</h1>
<input id="email" type="email" placeholder="Tu email de profe" autocomplete="username">
<input id="pass" type="password" placeholder="Tu contraseña" autocomplete="current-password">
<button onclick="migrar()">Migrar mis datos</button>
<div id="out"></div>
<script>
const SUPABASE_URL='https://yroinbaixsgdowhigfom.supabase.co';
const SUPABASE_KEY='sb_publishable_YuiKKtYILL-VlnDzXkwRMw_S1G4dCQi';
const JB_BIN='6a287256f5f4af5e29d42887';
const JB_KEY='$2a$10$WbkZ0bZdQ6evxIEHz5pFwOuC3LBF7sPcdrofhb1vOlRBjebQqN.lG';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const out=document.getElementById('out');
function log(msg,cls){ out.innerHTML += (cls?'<span class="'+cls+'">'+msg+'</span>':msg)+'\n'; }

async function migrar(){
  out.innerHTML='';
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  const { data: login, error: e1 }=await sb.auth.signInWithPassword({email,password:pass});
  if(e1){ log('Error de login: '+e1.message,'err'); return; }
  log('✓ Logueado como '+login.user.email,'ok');
  const uid=login.user.id;

  const { count }=await sb.from('players').select('*',{count:'exact',head:true});
  if(count && count>0){ log('⚠ Ya tenés '+count+' jugador(es) en Supabase. No migro de nuevo para no duplicar. Si querés rehacer, borralos primero en Table Editor.','warn'); return; }

  log('Leyendo JSONBin...');
  let rec;
  try{
    const r=await fetch('https://api.jsonbin.io/v3/b/'+JB_BIN+'/latest',{headers:{'X-Master-Key':JB_KEY,'X-Bin-Meta':'false'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    rec=await r.json();
  }catch(err){ log('Error leyendo JSONBin: '+err.message,'err'); return; }
  const root=rec.record||rec;
  const players=root.players||[]; const plans=root.plans||{}; const checks=root.checks||{};
  log('Encontré '+players.length+' jugador(es) en el bin.\n');

  let okP=0;
  for(const p of players){
    try{
      const { data: row, error: ep }=await sb.from('players').insert({
        trainer_id: uid, name: p.name||'(sin nombre)', club: p.club||'', pos: p.pos||'',
        photo_url: p.photo||'', pin: String(p.pin||''), active_week: p.activeWeek||0
      }).select('id').single();
      if(ep) throw ep;
      const newId=row.id;
      let parts=[];
      if(plans[p.id]){
        const { error: epl }=await sb.from('plans').insert({ player_id:newId, trainer_id:uid, weeks:plans[p.id] });
        parts.push(epl?'plan ERROR':'plan ✓');
      } else parts.push('sin plan');
      if(checks[p.id]){
        const { error: ec }=await sb.from('progress').insert({ player_id:newId, trainer_id:uid, checks:checks[p.id] });
        parts.push(ec?'checks ERROR':'checks ✓');
      } else parts.push('sin checks');
      log('✓ '+(p.name||'(sin nombre)')+'  ('+parts.join(', ')+')','ok');
      okP++;
    }catch(err){ log('✗ '+(p.name||'?')+': '+(err.message||err),'err'); }
  }
  log('\nListo. Migré '+okP+' de '+players.length+' jugadores.','ok');
  log('Verificá en Supabase → Table Editor → players.');
}
</script>
</body>
</html>
